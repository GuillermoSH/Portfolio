<!doctype html>
<html lang="es" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Guillermo Sicilia Hernández — desarrollador full-stack. Puerto de la Cruz, Canarias. Spring Boot, Angular, React, integración y bases de datos."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"

    />
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon" />
    <title>Guillermo Sicilia Hernández — Full-stack</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem("theme");
          if (s === "light") document.documentElement.classList.remove("dark");
          else document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="relative overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
